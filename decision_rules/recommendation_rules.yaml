recommendation_framework:
  objective: Rank feasible scenarios by rule risk, water use, and estimated water cost.

scenarios:
  - id: irrigate_now
    name: Irrigate now
    irrigation_mm: 20
    water_stress_reduction: 25
    description: Apply the configured full irrigation amount; reassess field conditions afterward.

  - id: reduced_irrigation
    name: Reduced irrigation
    irrigation_mm: 10
    water_stress_reduction: 15
    description: Apply half of the configured full amount and monitor soil moisture.

  - id: delay_and_monitor
    name: Delay irrigation and monitor
    irrigation_mm: 0
    water_stress_reduction: 0
    description: Do not irrigate now; reassess soil moisture and rainfall within 24 hours.