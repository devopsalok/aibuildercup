rules:
  - id: IRR-001
    name: Very low soil moisture
    category: water_stress
    conditions:
      - field: soil_moisture_pct
        operator: "<"
        value: 15
    score: 90
    action:
      type: assess_irrigation
      priority: high
    explanation:
      - Soil moisture is below the configured very-low threshold.

  - id: IRR-002
    name: Low soil moisture
    category: water_stress
    conditions:
      - field: soil_moisture_pct
        operator: "<"
        value: 25
    score: 65
    action:
      type: assess_irrigation
      priority: medium
    explanation:
      - Soil moisture is below the configured monitoring threshold.

  - id: IRR-003
    name: Low moisture during a critical wheat stage
    category: water_stress
    conditions:
      - field: soil_moisture_pct
        operator: "<"
        value: 35
      - field: growth_stage
        operator: in
        value:
          - crown_root_initiation
          - flowering
          - grain_filling
      - field: crop
        operator: "=="
        value: wheat
    score: 70
    action:
      type: assess_irrigation
      priority: high
    explanation:
      - Soil moisture is low during a growth stage marked critical for wheat.

  - id: IRR-004
    name: Low moisture during a critical rice stage
    category: water_stress
    conditions:
      - field: soil_moisture_pct
        operator: "<"
        value: 35
      - field: growth_stage
        operator: in
        value:
          - tillering
          - flowering
          - grain_filling
      - field: crop
        operator: "=="
        value: rice
    score: 70
    action:
      type: assess_irrigation
      priority: high
    explanation:
      - Soil moisture is low during a growth stage marked critical for rice.

  - id: IRR-005
    name: Low moisture during a critical maize stage
    category: water_stress
    conditions:
      - field: soil_moisture_pct
        operator: "<"
        value: 35
      - field: growth_stage
        operator: in
        value:
          - tasseling
          - silking
          - grain_filling
      - field: crop
        operator: "=="
        value: maize
    score: 70
    action:
      type: assess_irrigation
      priority: high
    explanation:
      - Soil moisture is low during a growth stage marked critical for maize.

  - id: IRR-006
    name: Low moisture during a critical cotton stage
    category: water_stress
    conditions:
      - field: soil_moisture_pct
        operator: "<"
        value: 35
      - field: growth_stage
        operator: in
        value:
          - flowering
          - boll_development
      - field: crop
        operator: "=="
        value: cotton
    score: 70
    action:
      type: assess_irrigation
      priority: high
    explanation:
      - Soil moisture is low during a growth stage marked critical for cotton.

  - id: IRR-007
    name: Rainfall expected soon
    category: water_stress
    conditions:
      - field: rainfall_probability_24h
        operator: ">="
        value: 0.7
      - field: rainfall_mm_24h
        operator: ">="
        value: 5
    score: 0
    action:
      type: consider_delaying_irrigation
      priority: low
    explanation:
      - Forecast rainfall may reduce the need for immediate irrigation; reassess if conditions change.