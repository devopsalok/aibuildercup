rules:
  - id: FERT-001
    name: Low soil nitrogen
    category: nutrient
    conditions:
      - field: nitrogen_mg_kg
        operator: "<"
        value: 20
    score: 65
    action:
      type: review_nitrogen_plan
      priority: medium
    explanation:
      - Soil nitrogen is below the configurable screening threshold; confirm with a local soil test recommendation.

